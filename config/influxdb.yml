default: &default
  host: <%= ENV.fetch("INFLUXDB_HOST", "127.0.0.1").split(',') %>
  port: <%= ENV.fetch("INFLUXDB_PORT", 8086) %>
  username: <%= ENV.fetch("INFLUXDB_USER", "root") %>
  password: <%= ENV.fetch("INFLUXDB_PASS", "root") %>

development:
  <<: *default
  database: exchange_barong

test:
  <<: *default
  database: exchange_test_barong

production:
  <<: *default
  database: <%= ENV.fetch('INFLUXDB_DATABASE_NAME', "exchange_pro_barong") %>
